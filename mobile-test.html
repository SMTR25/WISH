<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机访问测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-box {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .success { color: green; }
        .error { color: red; }
        button {
            padding: 10px 20px;
            background: #98d8c8;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>📱 手机访问测试</h1>
    
    <div class="test-box">
        <h2>✅ CSS加载测试</h2>
        <p id="css-test">如果看到这个白色背景框，说明CSS已加载</p>
    </div>
    
    <div class="test-box">
        <h2>✅ JavaScript测试</h2>
        <p id="js-test">等待JavaScript执行...</p>
    </div>
    
    <div class="test-box">
        <h2> 设备信息</h2>
        <p><strong>User Agent:</strong> <span id="ua"></span></p>
        <p><strong>屏幕宽度:</strong> <span id="screen-width"></span></p>
        <p><strong>屏幕高度:</strong> <span id="screen-height"></span></p>
    </div>
    
    <div class="test-box">
        <h2> 功能测试</h2>
        <button onclick="alert('按钮点击成功！')">点击测试按钮</button>
    </div>
    
    <script>
        // JavaScript测试
        document.getElementById('js-test').innerHTML = '<span class="success">✅ JavaScript正常运行</span>';
        
        // 设备信息
        document.getElementById('ua').textContent = navigator.userAgent;
        document.getElementById('screen-width').textContent = window.screen.width + 'px';
        document.getElementById('screen-height').textContent = window.screen.height + 'px';
        
        console.log('页面加载成功！');
        console.log('User Agent:', navigator.userAgent);
    </script>
</body>
</html>
