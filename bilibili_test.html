<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站API测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .status {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .test-section {
            margin: 2rem 0;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .test-section h2 {
            color: #495057;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin: 0.5rem;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .log-area {
            background: #2d2d2d;
            color: #00ff00;
            padding: 1rem;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 1rem;
        }
        
        .log-line {
            margin: 0.3rem 0;
            word-wrap: break-word;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .video-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .video-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        
        .video-card-info {
            padding: 0.8rem;
        }
        
        .video-card-title {
            font-weight: bold;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .video-card-desc {
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 B站API连接测试工具</h1>
        
        <div id="status" class="status info">
            准备就绪，点击下方按钮开始测试
        </div>
        
        <div class="test-section">
            <h2>📋 测试步骤</h2>
            <ol style="margin-left: 1.5rem; line-height: 2;">
                <li>点击"测试代理服务器"检查代理服务是否可用</li>
                <li>点击"搜索B站视频"尝试获取真实视频数据</li>
                <li>查看下方日志了解详细信息</li>
            </ol>
        </div>
        
        <div class="test-section">
            <h2>🔧 测试操作</h2>
            <button onclick="testProxyServers()">测试代理服务器</button>
            <button onclick="searchBilibiliVideos()">搜索B站视频</button>
            <button onclick="clearLog()">清空日志</button>
        </div>
        
        <div class="test-section">
            <h2>📊 测试结果</h2>
            <div id="video-results" class="video-grid"></div>
        </div>
        
        <div class="test-section">
            <h2>📝 详细日志</h2>
            <div id="log-area" class="log-area"></div>
        </div>
    </div>
    
    <script>
        const PROXY_SERVERS = [
            'https://api.allorigins.win/get?url=',
            'https://api.codetabs.com/v1/proxy?uri=',
            'https://corsproxy.io/?'
        ];
        
        function log(message, type = 'info') {
            const logArea = document.getElementById('log-area');
            const timestamp = new Date().toLocaleTimeString();
            const logLine = document.createElement('div');
            logLine.className = 'log-line';
            
            let icon = 'ℹ️';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';
            if (type === 'warn') icon = '⚠️';
            
            logLine.textContent = `[${timestamp}] ${icon} ${message}`;
            logArea.appendChild(logLine);
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }
        
        function clearLog() {
            document.getElementById('log-area').innerHTML = '';
            document.getElementById('video-results').innerHTML = '';
            log('日志已清空');
        }
        
        async function testProxy(proxyUrl, index) {
            try {
                log(`测试代理 ${index + 1}: ${proxyUrl}`);
                
                const testUrl = encodeURIComponent('https://api.bilibili.com/x/web-interface/search/type?keyword=NCT WISH&page=1&search_type=video&page_size=1');
                const response = await fetch(proxyUrl + testUrl, { timeout: 10000 });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.contents) {
                    const apiData = JSON.parse(data.contents);
                    if (apiData.code === 0) {
                        log(`代理 ${index + 1} 测试成功!`, 'success');
                        return true;
                    } else {
                        log(`代理 ${index + 1} 返回错误码: ${apiData.code}`, 'warn');
                        return false;
                    }
                } else {
                    log(`代理 ${index + 1} 返回数据格式异常`, 'error');
                    return false;
                }
            } catch (error) {
                log(`代理 ${index + 1} 失败: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function testProxyServers() {
            updateStatus('正在测试代理服务器...', 'info');
            log('开始测试所有代理服务器', 'info');
            
            let successCount = 0;
            
            for (let i = 0; i < PROXY_SERVERS.length; i++) {
                const result = await testProxy(PROXY_SERVERS[i], i);
                if (result) successCount++;
            }
            
            if (successCount > 0) {
                updateStatus(`测试完成: ${successCount}/${PROXY_SERVERS.length} 个代理可用`, 'success');
                log(`测试完成: ${successCount} 个代理可用`, 'success');
            } else {
                updateStatus('所有代理都不可用，请检查网络连接', 'error');
                log('所有代理都失败了', 'error');
            }
        }
        
        async function searchBilibiliVideos() {
            updateStatus('正在搜索B站视频...', 'info');
            log('开始搜索B站视频: NCT WISH', 'info');
            
            const keyword = 'NCT WISH';
            const page = 1;
            
            for (let proxyIndex = 0; proxyIndex < PROXY_SERVERS.length; proxyIndex++) {
                try {
                    const proxyUrl = PROXY_SERVERS[proxyIndex];
                    const apiUrl = encodeURIComponent(
                        `https://api.bilibili.com/x/web-interface/search/type?keyword=${encodeURIComponent(keyword)}&page=${page}&search_type=video&page_size=8`
                    );
                    
                    log(`尝试代理 ${proxyIndex + 1}: ${proxyUrl}`);
                    
                    const response = await fetch(proxyUrl + apiUrl, { timeout: 15000 });
                    const data = await response.json();
                    
                    if (!data.contents) {
                        log(`代理 ${proxyIndex + 1} 返回数据格式异常`, 'warn');
                        continue;
                    }
                    
                    const apiData = JSON.parse(data.contents);
                    
                    if (!apiData.data || !apiData.data.result || apiData.data.result.length === 0) {
                        log('未找到相关视频', 'warn');
                        updateStatus('未找到相关视频', 'info');
                        return;
                    }
                    
                    log(`✅ 代理 ${proxyIndex + 1} 成功! 找到 ${apiData.data.result.length} 个视频`, 'success');
                    updateStatus(`成功加载 ${apiData.data.result.length} 个B站视频`, 'success');
                    
                    // 显示结果
                    displayVideos(apiData.data.result.slice(0, 8));
                    return;
                    
                } catch (error) {
                    log(`代理 ${proxyIndex + 1} 失败: ${error.message}`, 'error');
                    if (proxyIndex === PROXY_SERVERS.length - 1) {
                        updateStatus('所有代理都失败了，请稍后重试', 'error');
                        log('所有代理都失败了', 'error');
                    }
                }
            }
        }
        
        function displayVideos(videos) {
            const container = document.getElementById('video-results');
            container.innerHTML = '';
            
            videos.forEach((video, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                
                const imageUrl = video.pic ? (video.pic.startsWith('http') ? video.pic : `https:${video.pic}`) : '';
                
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${video.title}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 200%22><rect fill=%22%23ddd%22 width=%22300%22 height=%22200%22/><text x=%2250%%22 y=%2250%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22>无图片</text></svg>'">
                    <div class="video-card-info">
                        <div class="video-card-title">${video.title.replace(/<[^>]+>/g, '').substring(0, 50)}</div>
                        <div class="video-card-desc">${video.author || 'UP主'} · ${formatPlayCount(video.play || 0)}播放</div>
                    </div>
                `;
                
                container.appendChild(card);
            });
            
            log(`已显示 ${videos.length} 个视频卡片`, 'success');
        }
        
        function formatPlayCount(count) {
            if (count >= 100000000) {
                return (count / 100000000).toFixed(1) + '亿';
            }
            if (count >= 10000) {
                return (count / 10000).toFixed(1) + '万';
            }
            return count.toString();
        }
        
        // 页面加载时自动测试
        window.addEventListener('load', () => {
            log('测试页面加载完成', 'success');
            log('提示: 由于浏览器安全策略，部分代理可能无法在本地文件中使用', 'warn');
            log('建议通过本地服务器(http://localhost)访问此页面进行测试', 'info');
        });
    </script>
</body>
</html>
